[project]
name = "avalon-harness"
version = "0.1.0"
description = "Avalon Harness: the multi-agent harness Avalon-M1-Mini was trained in, implementing the AgentOrg protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "General Reasoning" }]
dependencies = [
    "openai>=1.50.0",
    "openreward>=0.1.160",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anyio>=4.4",
    "rich>=13.7",
    "jsonschema>=4.18",
    "referencing>=0.28",
]

[project.scripts]
avalon = "agentorg.cli.sample:main"
avalon-inspect = "agentorg.cli.inspect_rollout:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentorg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
